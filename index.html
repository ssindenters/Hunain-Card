<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hunain Khatri | SS Indenters</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eef2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #17212b;
}

.card {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
    background: #ffffff;
    overflow: hidden;
}

/* PROFILE PHOTO */

.photo-area {
    width: 100%;
    height: 320px;
    overflow: hidden;
    background: #e8ecef;
}

.photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
}

/* MAIN CONTENT */

.content {
    padding: 28px 24px 35px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 750;
    letter-spacing: -0.5px;
}

.position {
    margin-top: 7px;
    font-size: 17px;
    font-weight: 600;
    color: #59646e;
}

.company {
    margin-top: 7px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
}

.business {
    max-width: 360px;
    margin: 13px auto 25px;
    color: #6b7680;
    font-size: 15px;
    line-height: 1.5;
}

/* SAVE CONTACT */

.save-contact {
    display: block;
    width: 100%;
    padding: 16px;
    margin-bottom: 13px;
    background: #197052;
    color: #ffffff;
    text-decoration: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
}

/* CONTACT BUTTONS */

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 11px;
}

.button {
    display: block;
    padding: 15px 6px;
    background: #17212b;
    color: #ffffff;
    text-decoration: none;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 650;
}

.whatsapp {
    background: #128C7E;
}

/* SLOGAN */

.slogan {
    margin-top: 28px;
    padding-top: 21px;
    border-top: 1px solid #e3e7ea;
    color: #687580;
    font-size: 14px;
    font-style: italic;
    line-height: 1.5;
}

.footer {
    margin-top: 18px;
    color: #9aa3aa;
    font-size: 11px;
    letter-spacing: 1.5px;
}

</style>
</head>

<body>

<div class="card">

    <!-- PHOTO -->

    <div class="photo-area">
        <img
            src="hunain.jpg..jpg"
            class="photo"
            alt="Hunain Khatri">
    </div>

    <div class="content">

        <h1>Hunain Khatri</h1>

        <div class="position">
            Managing Director
        </div>

        <div class="company">
            SS INDENTERS
        </div>

        <div class="business">
            International Brokers of Pulses, Grains &amp; Oilseeds
        </div>

        <!-- SAVE CONTACT -->

        <a class="save-contact" href="hunain.vcf">
            ＋ Save Contact
        </a>

        <!-- OTHER BUTTONS -->

        <div class="buttons">

            <a
            class="button whatsapp"
            href="https://wa.me/923002755465"
            target="_blank">
                WhatsApp
            </a>

            <a
            class="button"
            href="tel:+923002755465">
                Call
            </a>

            <a
            class="button"
            href="mailto:khatrihunain1@gmail.com">
                Email
            </a>

            <a
            class="button"
            href="https://www.linkedin.com/in/hunain-khatri-b1469141"
            target="_blank">
                LinkedIn
            </a>

        </div>

        <div class="slogan">
            “Bridging Continents with the Best Pulses and Grains.”
        </div>

        <div class="footer">
            SS INDENTERS
        </div>

    </div>

</div>

</body>
</html>
